<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Portal - Blood Life Line</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 1200px; margin: 0 auto; overflow: hidden; }
        .header { background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%); color: white; text-align: center; padding: 40px 20px; position: relative; }
        .back-btn { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.2); border: 2px solid white; color: white; padding: 10px 20px; border-radius: 25px; cursor: pointer; transition: 0.3s; text-decoration: none; }
        .back-btn:hover { background: white; color: #e74c3c; }
        .content { padding: 40px; }
        .portal-section { margin-bottom: 30px; }
        .section-title { color: #e74c3c; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #f0f0f0; }
        .portal-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .portal-card { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); border-radius: 15px; padding: 25px; text-align: center; transition: 0.3s; cursor: pointer; border: 2px solid transparent; }
        .portal-card:hover { transform: translateY(-5px); border-color: #e74c3c; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .portal-icon { width: 60px; height: 60px; margin: 0 auto 15px; background: #e74c3c; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8em; color: white; }
        .info-box { background: #f8f9fa; border-left: 4px solid #e74c3c; padding: 20px; margin-top: 20px; border-radius: 5px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
        .stat-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 10px; text-align: center; }
        .stat-number { font-size: 2em; font-weight: bold; margin-bottom: 5px; }
        .stat-label { font-size: 0.9em; opacity: 0.9; }
        .donor-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .donor-card { background: white; border: 2px solid #ecf0f1; border-radius: 10px; padding: 20px; transition: all 0.3s ease; }
        .donor-card:hover { border-color: #e74c3c; box-shadow: 0 5px 15px rgba(231, 76, 60, 0.2); transform: translateY(-3px); }
        .donor-card h3 { color: #2c3e50; margin-bottom: 10px; font-size: 1.3em; }
        .donor-info { display: flex; flex-direction: column; gap: 8px; }
        .donor-info-row { display: flex; align-items: flex-start; gap: 8px; }
        .donor-info-row strong { color: #7f8c8d; min-width: 80px; font-size: 0.85em; }
        .donor-info-row span { color: #2c3e50; flex: 1; }
        .donor-badge { display: inline-block; padding: 4px 12px; border-radius: 15px; font-size: 0.85em; font-weight: 600; margin-top: 10px; }
        .donor-badge.blood { background: #ffebee; color: #c62828; }
        .donor-badge.organ { background: #e3f2fd; color: #1565c0; }
        .loading { text-align: center; padding: 40px; color: #7f8c8d; font-size: 1.2em; }
        .error { background: #ffebee; border-left: 4px solid #e74c3c; padding: 20px; margin: 20px 0; color: #c62828; border-radius: 5px; }
        .no-data { text-align: center; padding: 40px; color: #7f8c8d; font-style: italic; }
        .search-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .search-group { display: flex; flex-direction: column; gap: 8px; }
        .search-group label { color: #2c3e50; font-weight: 600; font-size: 0.9em; }
        .search-group select, .search-group input { padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1em; transition: all 0.3s ease; }
        .search-group select:focus, .search-group input:focus { outline: none; border-color: #e74c3c; box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.1); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="index.html" class="back-btn">← Back</a>
            <h1>🏥 Hospital Portal</h1>
            <p>Comprehensive Hospital Management & Services</p>
        </div>

        <div class="content">
            <div class="portal-section">
                <h2 class="section-title">Select Donor Type</h2>
                <div class="portal-cards">
                    <div class="portal-card" onclick="showDonors('blood')">
                        <div class="portal-icon">🩸</div>
                        <h3>Blood Donor</h3>
                        <p>View all registered blood donors</p>
                    </div>
                    <div class="portal-card" onclick="showDonors('organ')">
                        <div class="portal-icon">🫀</div>
                        <h3>Organ Donor</h3>
                        <p>View all registered organ donors</p>
                    </div>
                </div>
            </div>

            <div class="portal-section" id="donorsSection" style="display: none;">
                <div class="section-header">
                    <h2 class="section-title" id="donorTypeTitle">Registered Donors</h2>
                </div>
                
                <div id="searchSection" style="display: none;">
                    <div class="search-container">
                        <div class="search-group">
                            <label for="bloodSearch">🩸 Search by Blood Group</label>
                            <select id="bloodSearch" onchange="filterDonors()">
                                <option value="">All Blood Groups</option>
                                <option value="A+">A+</option>
                                <option value="A-">A-</option>
                                <option value="B+">B+</option>
                                <option value="B-">B-</option>
                                <option value="O+">O+</option>
                                <option value="O-">O-</option>
                                <option value="AB+">AB+</option>
                                <option value="AB-">AB-</option>
                            </select>
                        </div>
                        <div class="search-group">
                            <label for="addressSearch">📍 Search by Address</label>
                            <input type="text" id="addressSearch" placeholder="Enter address..." oninput="filterDonors()">
                        </div>
                    </div>
                </div>
                
                <div id="donorsContent">
                    <div class="loading">Loading donor data...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allDonors = [];
        let currentDonorType = '';

        // Filter donors based on search criteria
        function filterDonors() {
            const bloodSearch = document.getElementById('bloodSearch').value.toLowerCase();
            const addressSearch = document.getElementById('addressSearch').value.toLowerCase();
            
            let filteredDonors = allDonors.filter(donor => donor.Type === currentDonorType);
            
            // Only apply blood group filter for blood donors
            if (currentDonorType === 'blood' && bloodSearch) {
                filteredDonors = filteredDonors.filter(donor => 
                    donor['Blood Group'] && donor['Blood Group'].toLowerCase() === bloodSearch
                );
            }
            
            // Apply address filter
            if (addressSearch) {
                filteredDonors = filteredDonors.filter(donor => 
                    donor.Address && donor.Address.toLowerCase().includes(addressSearch)
                );
            }
            
            displayDonors(filteredDonors);
        }

        // Display donors in the grid
        function displayDonors(donors) {
            const donorsContent = document.getElementById('donorsContent');
            
            if (donors.length === 0) {
                donorsContent.innerHTML = `<div class="no-data">No ${currentDonorType} donors found matching your search</div>`;
                return;
            }

            let html = '<div class="donor-grid">';
            donors.forEach(donor => {
                const detailLabel = donor.Type === 'blood' ? 'Blood Group' : 'Organ';
                const detailValue = donor.Type === 'blood' ? donor['Blood Group'] : donor['Organ Type'];

                html += `
                    <div class="donor-card">
                        <h3>${donor['First Name']} ${donor['Last Name']}</h3>
                        <div class="donor-info">
                            <div class="donor-info-row">
                                <strong>${detailLabel}:</strong>
                                <span style="color:#e74c3c; font-weight:bold;">${detailValue}</span>
                            </div>
                            <div class="donor-info-row">
                                <strong>Phone:</strong>
                                <span>${donor.Phone}</span>
                            </div>
                            ${donor.Address ? `
                            <div class="donor-info-row">
                                <strong>Address:</strong>
                                <span>${donor.Address}</span>
                            </div>
                            ` : ''}
                            <div class="donor-info-row">
                                <strong>Registered:</strong>
                                <span>${donor.Date}</span>
                            </div>
                        </div>
                        <span class="donor-badge ${donor.Type}">${donor.Type.toUpperCase()} DONOR</span>
                    </div>
                `;
            });
            html += '</div>';
            donorsContent.innerHTML = html;
        }

        // Show donors by type
        async function showDonors(type) {
            currentDonorType = type;
            const donorsSection = document.getElementById('donorsSection');
            const donorsContent = document.getElementById('donorsContent');
            const titleElement = document.getElementById('donorTypeTitle');
            const searchSection = document.getElementById('searchSection');

            // Update title
            titleElement.textContent = type === 'blood' ? '🩸 Blood Donors' : '🫀 Organ Donors';

            // Show/hide search section based on donor type (only for blood donors)
            if (type === 'blood') {
                searchSection.style.display = 'block';
                // Reset search fields
                document.getElementById('bloodSearch').value = '';
                document.getElementById('addressSearch').value = '';
            } else {
                searchSection.style.display = 'none';
            }

            // Show section
            donorsSection.style.display = 'block';
            donorsContent.innerHTML = '<div class="loading">Loading donor data...</div>';

            // If we haven't loaded donors yet, fetch them
            if (allDonors.length === 0) {
                await loadDonors();
            }

            // Filter donors by type and display
            const filteredDonors = allDonors.filter(donor => donor.Type === type);
            displayDonors(filteredDonors);
        }

        // Load Donors Data
        async function loadDonors() {
            try {
                const response = await fetch('/api/donors');
                const result = await response.json();

                if (!result.success || result.donors.length === 0) {
                    allDonors = [];
                    return;
                }

                allDonors = result.donors;
            } catch (e) {
                console.error('Error loading donors:', e);
                allDonors = [];
            }
        }
    </script>
</body>
</html>
